# =========================
# Application
# =========================
spring.application.name=Pharmacy-Manager
server.port=8080

# =========================
# Database Configuration (PostgreSQL)
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/pharmaconnect
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / Hibernate
# =========================
# Hibernate will NOT touch tables ? Flyway handles schema.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public

# =========================
# Flyway Migration
# =========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=false

# =========================
# ChatBot
# =========================
openapi.api.url=https://api.openai.com/v1/chat/completions
openapi.api.model=gpt-4o-mini
spring.config.import=optional:secrets.properties

# =========================
# Logging
# =========================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework=INFO
logging.level.org.flywaydb.core=INFO