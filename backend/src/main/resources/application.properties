# =========================
# Application
# =========================
spring.application.name=Pharmacy-Manager
server.port=8080

# =========================
# Database Configuration (PostgreSQL)
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/pharmaconnect
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / Hibernate
# =========================
# Hibernate will NOT touch tables ? Flyway handles schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# =========================
# Flyway Migration
# =========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Allow Flyway to clean and re-run migrations
spring.flyway.clean-disabled=false

# =========================
# Logging
# =========================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework=INFO
logging.level.org.flywaydb.core=INFO